name: Deploy to Azure

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_DIR: infra/terraform
  TF_IN_AUTOMATION: 'true'

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test C# API
        run: dotnet test src/api-cs-tests

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Lint frontend
        working-directory: src/frontend
        run: npm run lint

      - name: Test frontend
        working-directory: src/frontend
        run: npm run test:unit

      - name: Build frontend
        working-directory: src/frontend
        run: npm run build

      - uses: hashicorp/setup-terraform@v3

      - name: Validate Terraform
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

  deploy:
    name: Provision and deploy
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write # OIDC token for azure/login
      contents: read
    env:
      ARM_USE_OIDC: 'true'
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_image_tag: ${{ github.sha }}
      TF_VAR_payment_api_key: ${{ secrets.PAYMENT_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}" \
            -backend-config="key=octocat-${{ github.event.repository.name }}.tfstate"

      # The registry must exist before images can be pushed, and the container apps
      # need those images, so create the registry first.
      - name: Provision registry
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -input=false -auto-approve -target=azurerm_container_registry.acr

      - name: Build and push images
        working-directory: ${{ env.TF_DIR }}
        run: |
          ACR_NAME=$(terraform output -raw acr_name)
          LOGIN_SERVER=$(terraform output -raw acr_login_server)
          az acr login --name "$ACR_NAME"
          cd "$GITHUB_WORKSPACE"
          docker build -f src/api-cs/Dockerfile -t "$LOGIN_SERVER/octocat-api:${{ github.sha }}" src
          docker build -t "$LOGIN_SERVER/octocat-web:${{ github.sha }}" src/frontend
          docker push "$LOGIN_SERVER/octocat-api:${{ github.sha }}"
          docker push "$LOGIN_SERVER/octocat-web:${{ github.sha }}"

      - name: Provision infrastructure and deploy
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -input=false -auto-approve

      - name: Read deployment URLs
        id: urls
        working-directory: ${{ env.TF_DIR }}
        run: |
          echo "api=$(terraform output -raw api_url)" >> "$GITHUB_OUTPUT"
          echo "web=$(terraform output -raw frontend_url)" >> "$GITHUB_OUTPUT"

      - name: Smoke test (cart and checkout through the API)
        env:
          API_URL: ${{ steps.urls.outputs.api }}
          WEB_URL: ${{ steps.urls.outputs.web }}
        run: |
          set -euo pipefail

          echo "Waiting for the API at $API_URL"
          for i in $(seq 1 30); do
            if curl -fsS "$API_URL/api/products" -o /dev/null; then break; fi
            if [ "$i" = 30 ]; then echo "API did not become ready"; exit 1; fi
            sleep 10
          done

          curl -fsS "$WEB_URL/" -o /dev/null
          curl -fsS "$WEB_URL/runtime-config.js" | grep -q "$API_URL"

          CART_ID=$(curl -fsS -X POST "$API_URL/api/carts" | jq -r .cartId)
          curl -fsS -X POST "$API_URL/api/carts/$CART_ID/items" \
            -H 'Content-Type: application/json' -d '{"productId":1,"quantity":2}' | jq -e '.itemCount == 2'

          YEAR=$(date -d '+2 years' +%y)
          DECLINE=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$API_URL/api/carts/$CART_ID/checkout" \
            -H 'Content-Type: application/json' \
            -d "{\"customerName\":\"CI\",\"email\":\"ci@example.com\",\"cardNumber\":\"4000000000000002\",\"expiry\":\"12/$YEAR\",\"cvc\":\"123\"}")
          [ "$DECLINE" = 402 ]
          curl -fsS "$API_URL/api/carts/$CART_ID" | jq -e '.itemCount == 2'

          curl -fsS -X POST "$API_URL/api/carts/$CART_ID/checkout" \
            -H 'Content-Type: application/json' \
            -d "{\"customerName\":\"CI\",\"email\":\"ci@example.com\",\"cardNumber\":\"4242424242424242\",\"expiry\":\"12/$YEAR\",\"cvc\":\"123\"}" \
            | jq -e '.status == "confirmed"'
          curl -fsS "$API_URL/api/carts/$CART_ID" | jq -e '.itemCount == 0'

          echo "### Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Frontend: $WEB_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: $API_URL" >> "$GITHUB_STEP_SUMMARY"
